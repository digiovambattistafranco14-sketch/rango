<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de voz</title>
<style>body{font:18px/1.4 -apple-system,Arial,sans-serif;margin:20px;background:#f4efe6;color:#1f2d2a}
button{font-size:20px;padding:16px;margin:8px 0;width:100%;border-radius:12px;border:2px solid #1f2d2a;background:#e0a22f}
pre{white-space:pre-wrap;background:#fff;padding:10px;border-radius:8px;font-size:14px}</style></head><body>
<h2>Prueba de voz</h2>
<p>Subí el volumen y sacá el silencio del costado. Tocá los botones de a uno.</p>
<button id="a">1. Hablar (voz por defecto)</button>
<button id="b">2. Hablar en español</button>
<button id="c">3. Sonido de prueba (pip)</button>
<button id="d">4. Hablar + audio silencioso de fondo</button>
<button id="e">5. Voz de Gemini (por Bluetooth)</button>
<pre id="log">cargando…</pre>
<script>
const log=(t)=>{document.getElementById('log').textContent+='\n'+t};
document.getElementById('log').textContent='';
log('speechSynthesis: '+(window.speechSynthesis?'sí':'NO'));
function voces(){const v=speechSynthesis.getVoices();return v.length+' voces; español: '+v.filter(x=>/^es/i.test(x.lang)).map(x=>x.name+' ('+x.lang+')').join(', ')}
try{log(voces());speechSynthesis.onvoiceschanged=()=>log('voces cargadas -> '+voces())}catch(e){log('error voces: '+e)}
function hablar(es){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance('Hola, soy Rango. Si me escuchás, funciona.');
    if(es){u.lang='es-AR';const v=speechSynthesis.getVoices().find(x=>/^es/i.test(x.lang));if(v){u.voice=v;log('uso voz: '+v.name)}}
    u.volume=1;
    u.onstart=()=>log('→ empezó a hablar');
    u.onend=()=>log('→ terminó');
    u.onerror=(e)=>log('→ ERROR: '+e.error);
    speechSynthesis.speak(u);
    log('pedido enviado (speaking='+speechSynthesis.speaking+')');
  }catch(e){log('excepción: '+e)}
}
document.getElementById('a').onclick=()=>hablar(false);
document.getElementById('b').onclick=()=>hablar(true);
document.getElementById('c').onclick=()=>{
  try{const A=new (window.AudioContext||window.webkitAudioContext)();A.resume();const o=A.createOscillator(),g=A.createGain();g.gain.value=0.3;o.frequency.value=660;o.connect(g);g.connect(A.destination);o.start();setTimeout(()=>o.stop(),500);log('pip enviado (estado: '+A.state+')')}catch(e){log('error pip: '+e)}
};

// 4: mantiene el audio "de reproducción" activo para ver si la voz sigue al JBL
let ctxFondo=null;
document.getElementById('d').onclick=()=>{
  try{
    if(!ctxFondo){ctxFondo=new (window.AudioContext||window.webkitAudioContext)();const o=ctxFondo.createOscillator(),g=ctxFondo.createGain();g.gain.value=0.0001;o.connect(g);g.connect(ctxFondo.destination);o.start()}
    ctxFondo.resume();log('audio de fondo activo ('+ctxFondo.state+')');
  }catch(e){log('error fondo: '+e)}
  hablar(true);
};
// 5: pide el audio a Gemini y lo reproduce con WebAudio (sale por el JBL como el pip)
document.getElementById('e').onclick=async()=>{
  let clave='';try{clave=localStorage.getItem('asistente_clave')||''}catch{}
  if(!clave){log('No encuentro la clave: abrí Rango (index) en este mismo navegador y guardala en Ajustes.');return}
  const ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();
  const modelos=['gemini-2.5-flash-preview-tts','gemini-2.5-flash-tts','gemini-2.5-pro-preview-tts'];
  for(const m of modelos){
    try{
      log('probando '+m+'…');
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':clave},
        body:JSON.stringify({contents:[{parts:[{text:'Decí con voz amable y tono argentino: Hola, soy Rango. Si me escuchás por el parlante, funciona.'}]}],generationConfig:{responseModalities:['AUDIO'],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:'Kore'}}}}})});
      if(!r.ok){log('  '+m+' -> HTTP '+r.status);continue}
      const j=await r.json();
      const p=j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.find(x=>x.inlineData);
      if(!p){log('  '+m+' -> sin audio');continue}
      const bin=atob(p.inlineData.data);const n=bin.length>>1;const buf=ctx.createBuffer(1,n,24000);const ch=buf.getChannelData(0);
      for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v>=32768)v-=65536;ch[i]=v/32768}
      const src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);src.start();
      log('  '+m+' -> reproduciendo ('+(n/24000).toFixed(1)+' s)');return;
    }catch(e){log('  '+m+' -> error: '+e)}
  }
  log('Ningún modelo de voz de Gemini respondió.');
};
</script></body></html>
